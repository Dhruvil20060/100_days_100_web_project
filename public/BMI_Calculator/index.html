<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="calculator">

    <div class="header">
      <h1>BMI Calculator</h1>

      <button id="themeToggle">☀️</button>
    </div>

    <div class="grid">

      <div class="input-group">
        <label>Height (cm)</label>
        <input type="number" id="height" placeholder="170">
      </div>

      <div class="input-group">
        <label>Weight (kg)</label>
        <input type="number" id="weight" placeholder="70">
      </div>

      <div class="input-group">
        <label>Age</label>
        <input type="number" id="age" placeholder="21">
      </div>

      <div class="input-group">
        <label>Gender</label>

        <select id="gender">
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>

    </div>

    <button class="calculate-btn" onclick="calculateBMI()">
      Calculate BMI
    </button>

    <div class="result">

      <h2 id="bmiResult">0.0</h2>

      <p id="bmiCategory">
        Your result will appear here
      </p>

    </div>

  </div>


  <div class="info-panel">

    <div class="card">
      <h3>Healthy BMI</h3>

      <p>
        BMI between 18.5 and 24.9 is considered healthy.
      </p>
    </div>

    <div class="card">
      <h3>How BMI Works</h3>

      <p>
        BMI estimates body condition using height and weight.
      </p>
    </div>

    <div class="card">
      <h3>Health Tips</h3>

      <ul>
        <li>Exercise regularly</li>
        <li>Drink water</li>
        <li>Eat balanced diet</li>
      </ul>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
